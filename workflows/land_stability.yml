metadata:
  name: landslide-risk
  namespace: cif
spec:
  templates:
    - name: execute
      inputs:
        parameters:
          - name: start_date
            value: "2019-01-07"
          - name: end_date
            value: "2023-12-18"
          - name: process_output_loc
            value: /data/output
      outputs: {}
      metadata: {}
      steps:
        - - name: landslide-risk
            template: landslide-risk
            arguments:
              parameters:
                - name: start_date
                  value: "{{inputs.parameters.start_date}}"
                - name: end_date
                  value: "{{inputs.parameters.end_date}}"
                - name: process_output_loc
                  value: "{{inputs.parameters.process_output_loc}}"
        - - name: cogify
            template: cogify
            arguments: {}
        - - name: list-data
            template: s3list
            arguments: {}
    - name: landslide-risk
      inputs:
        parameters:
          - name: start_date
            value: "2019-01-07"
          - name: end_date
            value: "2023-12-18"
          - name: process_output_loc
            value: /data/output
      outputs:
        artifacts:
          - name: message
            path: /data/output
            s3:
              endpoint: obs.eu-nl.otc.t-systems.com
              bucket: gtif-data-cerulean1
              accessKeySecret:
                name: gtif-data-cerulean1-bucket
                key: username
              secretKeySecret:
                name: gtif-data-cerulean1-bucket
                key: password
              key: output-data-landslide-risk/{{workflow.name}}
            archive:
              none: {}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cce.cloud.com/cce-nodepool
                    operator: In
                    values:
                      - user
      metadata: {}
      container:
        name: ""
        image: swr.eu-nl.otc.t-systems.com/gtif/landslide_risk:1.0.0
        command:
          - /bin/bash
        args:
          - -c
          - |
            set -a
            set +a 
            mkdir -p /data/output && \
            bash /home/app/scripts/run_process.sh \
              '{{workflow.parameters.start_date}}' \
              '{{workflow.parameters.end_date}}' \
              '{{workflow.parameters.process_output_loc}}'
        resources: {}
        volumeMounts:
          - name: data-dir
            mountPath: /data
      volumes:
        - name: data-dir
          emptyDir: {}
      tolerations:
        - key: hub.jupyter.org_dedicated
          operator: Equal
          value: user
          effect: NoSchedule
    - name: cogify
      inputs:
        artifacts:
          - name: outputs_in
            path: /workspace/input
            s3:
              endpoint: obs.eu-nl.otc.t-systems.com
              bucket: gtif-data-cerulean1
              accessKeySecret:
                name: gtif-data-cerulean1-bucket
                key: username
              secretKeySecret:
                name: gtif-data-cerulean1-bucket
                key: password
              key: output-data-landslide-risk/{{workflow.name}}/COGs/
      outputs:
        artifacts:
          - name: outputs
            path: /workspace/output/final_cog.tif
            s3:
              endpoint: obs.eu-nl.otc.t-systems.com
              bucket: gtif-data-cerulean1
              accessKeySecret:
                name: gtif-data-cerulean1-bucket
                key: username
              secretKeySecret:
                name: gtif-data-cerulean1-bucket
                key: password
              key: output-data-landslide-risk/{{workflow.name}}/final/final_cog.tif
            archive:
              none: {}
      metadata: {}
      container:
        name: ""
        image: registry.gitlab.eox.at/public-images/gdal/ubuntu-full-3.10
        command:
          - bash
          - -c
        args:
          - |
            set -euo pipefail
            shopt -s nullglob

            IN_DIR="/workspace/input"
            OUT_DIR="/workspace/output"
            OUT_FILE="${OUT_DIR}/final_cog.tif"
            mkdir -p "$OUT_DIR"

            # Collect GeoTIFFs
            files=("$IN_DIR"/*.tif "$IN_DIR"/*.tiff)
            if [ ${#files[@]} -eq 0 ]; then
              echo "No input GeoTIFFs found in ${IN_DIR}"; exit 1
            fi

            echo "Found ${#files[@]} input COGs. Building mosaic → ${OUT_FILE}"

            gdalwarp \
              -s_srs EPSG:3035 -t_srs EPSG:3857 \
              -r near \
              -multi -wo NUM_THREADS=ALL_CPUS \
              -of COG \
              -co COMPRESS=DEFLATE -co BIGTIFF=IF_SAFER -co BLOCKSIZE=512 \
              "${files[@]}" "$OUT_FILE"

            echo "Done. Output:"
            gdalinfo "$OUT_FILE" | sed -n '1,25p'
        resources: {}
    - name: s3list
      inputs: {}
      outputs:
        parameters:
          - name: json
            valueFrom:
              path: /tmp/out.json
            globalName: urls
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cce.cloud.com/cce-nodepool
                    operator: In
                    values:
                      - user
      metadata: {}
      container:
        name: ""
        image: ghcr.io/eoxhub-workspaces/process-s3-files:0.0.12
        command:
          - sh
          - -c
        args:
          - ./process_s3_files.sh --group
            "regex=.*final*.*\.tif,id=output_landslide_risk,mimetype=image/tiff"
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: gtif-data-cerulean1-bucket
                key: username
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: gtif-data-cerulean1-bucket
                key: password
          - name: AWS_S3_ENDPOINT
            value: https://obs.eu-nl.otc.t-systems.com
          - name: AWS_REGION
            value: eu-nl
          - name: BUCKET
            value: gtif-data-cerulean1
          - name: BPATH
            value: output-data-landslide-risk/{{workflow.name}}
          - name: ACL
            value: public-read
          - name: NUM_FILES
            value: "20"
          - name: DEBUG
            value: "false"
          - name: PUBLISH_JSON
            value: "true"
          - name: PUBLISH_JSON_FILENAME_ENV_VAR
            value: ARGO_NODE_ID
          - name: PUBLISH_JSON_FILENAME_REGEX
            value: (pygeoapi-job-)([0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12})
          - name: PUBLISH_JSON_FILENAME_REGEX_MATCH_GROUP
            value: "2"
          - name: PUBLISH_JSON_SUBFOLDER
            value: /pygeoapi/resultlinks/
          - name: PUBLISH_JSON_ACL
            value: public-read
        resources: {}
      tolerations:
        - key: hub.jupyter.org_dedicated
          operator: Equal
          value: user
          effect: NoSchedule
  arguments: {}
  serviceAccountName: argo-workflow
  imagePullSecrets:
    - name: flux-cerulean

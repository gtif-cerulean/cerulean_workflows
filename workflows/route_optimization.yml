metadata:
  name: route-optimization
  namespace: cif
spec:
  templates:
    - name: execute
      inputs:
        parameters:
          - name: start_lat
            value: "75"
          - name: start_lon
            value: "-70"
          - name: end_lat
            value: "74"
          - name: end_lon
            value: "-66"
          - name: path
            value: route_optimization/202601102145_Qaanaaq_RIC.zip
      outputs: {}
      metadata: {}
      steps:
        - - name: route-optimization
            template: route-optimization
            arguments:
              parameters:
                - name: start_lat
                  value: "{{inputs.parameters.start_lat}}"
                - name: start_lon
                  value: "{{inputs.parameters.start_lon}}"
                - name: end_lat
                  value: "{{inputs.parameters.end_lat}}"
                - name: end_lon
                  value: "{{inputs.parameters.end_lon}}"
                - name: path
                  value: "{{inputs.parameters.path}}"
        - - name: s3list
            template: s3list
            arguments: {}
    - name: route-optimization
      inputs:
        parameters:
          - name: start_lat
          - name: start_lon
          - name: end_lat
          - name: end_lon
          - name: path
        artifacts:
          - name: route_zip
            path: /charts/route.zip
            s3:
              endpoint: obs.eu-nl.otc.t-systems.com
              bucket: gtif-data-cerulean1
              accessKeySecret:
                name: gtif-data-cerulean1-bucket
                key: username
              secretKeySecret:
                name: gtif-data-cerulean1-bucket
                key: password
              key: "{{inputs.parameters.path}}"
      outputs:
        artifacts:
          - name: results
            path: /app/output/
            s3:
              endpoint: obs.eu-nl.otc.t-systems.com
              bucket: gtif-data-cerulean1
              accessKeySecret:
                name: gtif-data-cerulean1-bucket
                key: username
              secretKeySecret:
                name: gtif-data-cerulean1-bucket
                key: password
              key: route_optimization/workflows/{{workflow.uid}}/results
            archive:
              none: {}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cce.cloud.com/cce-nodepool
                    operator: In
                    values:
                      - user
      metadata: {}
      script:
        name: ""
        image: swr.eu-nl.otc.t-systems.com/gtif/paal:0.3
        command:
          - sh
          - -c
        resources: {}
        source: >
          mkdir -p /app/output 

          # Run the route optimization

          python Route.py \
            --path /charts/route.zip \
            --start {{inputs.parameters.start_lat}} {{inputs.parameters.start_lon}} \
            --end {{inputs.parameters.end_lat}} {{inputs.parameters.end_lon}} \
            --ice_class PC5


          # Move all generated files to output directory  

          mv /app/*.geojson /app/output/ 

          mv /app/*.csv /app/output/

          echo "=== Output files saved ===" 

          ls -la /app/output/
      tolerations:
        - key: hub.jupyter.org_dedicated
          operator: Equal
          value: user
          effect: NoSchedule
    - name: s3list
      inputs: {}
      outputs:
        parameters:
          - name: json
            valueFrom:
              path: /tmp/out.json
            globalName: urls
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cce.cloud.com/cce-nodepool
                    operator: In
                    values:
                      - user
      metadata: {}
      container:
        name: ""
        image: ghcr.io/eoxhub-workspaces/process-s3-files:0.0.12
        command:
          - sh
          - -c
        args:
          - ./process_s3_files.sh --group
            "regex=.*_full.*\.geojson,id=output_route_geojson,mimetype=application/geo+json"
        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: gtif-data-cerulean1-bucket
                key: username
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: gtif-data-cerulean1-bucket
                key: password
          - name: AWS_S3_ENDPOINT
            value: https://obs.eu-nl.otc.t-systems.com
          - name: AWS_REGION
            value: eu-nl
          - name: BUCKET
            value: gtif-data-cerulean1
          - name: BPATH
            value: route_optimization/workflows/{{workflow.uid}}/results
          - name: ACL
            value: public-read
          - name: NUM_FILES
            value: "10"
          - name: DEBUG
            value: "false"
          - name: PUBLISH_JSON
            value: "true"
          - name: PUBLISH_JSON_FILENAME_ENV_VAR
            value: ARGO_NODE_ID
          - name: PUBLISH_JSON_FILENAME_REGEX
            value: (pygeoapi-job-)([0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12})
          - name: PUBLISH_JSON_FILENAME_REGEX_MATCH_GROUP
            value: "2"
          - name: PUBLISH_JSON_SUBFOLDER
            value: /pygeoapi/resultlinks/
          - name: PUBLISH_JSON_ACL
            value: public-read
        resources: {}
      tolerations:
        - key: hub.jupyter.org_dedicated
          operator: Equal
          value: user
          effect: NoSchedule
  entrypoint: execute
  arguments: {}
  serviceAccountName: argo-workflow
  imagePullSecrets:
    - name: flux-cerulean
